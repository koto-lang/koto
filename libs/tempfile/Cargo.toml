[package]
name = "koto_tempfile"
version = "0.17.0"
description = "A Koto library for working with temporary files"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["rc"]

# Only one memory management strategy can be enabled at a time.
# To use `arc`, default features must be disabled.
arc = ["koto_runtime/arc"]
rc = ["koto_runtime/rc"]
plugin = ["dep:koto_plugin"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
koto_runtime = { workspace = true }
koto_plugin = { path = "../../crates/plugin", optional = true }

tempfile = { workspace = true }

[dev-dependencies]
koto_test_utils = { workspace = true }
